name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: windows
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: TriJello-windows
          path: windows/target/release/trijello.exe
